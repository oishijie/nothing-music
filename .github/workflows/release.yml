name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.android/keystores"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/keystores/nothing-music-release.keystore"
          cat > keystore.properties <<EOF
          storeFile=$HOME/.android/keystores/nothing-music-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Run unit tests
        run: ./gradlew app:testDebugUnitTest --stacktrace

      - name: Build release APK
        run: ./gradlew app:assembleRelease --stacktrace

      - name: Rename APK with version tag
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
            NothingMusic-${GITHUB_REF_NAME#v}-release.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NothingMusic-*-release.apk
          generate_release_notes: true
